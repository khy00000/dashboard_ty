# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
        env:
          VITE_USE_MOCK_DATA: ${{ secrets.VITE_USE_MOCK_DATA }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_ID: ${{ secrets.VITE_GOOGLE_MAPS_ID }}
          VITE_OPENSKY_USERNAME: ${{ secrets.VITE_OPENSKY_USERNAME }}
          VITE_OPENSKY_PASSWORD: ${{ secrets.VITE_OPENSKY_PASSWORD }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AIRCRAFT_T_DASHBOARD }}
          channelId: live
          projectId: aircraft-t-dashboard
